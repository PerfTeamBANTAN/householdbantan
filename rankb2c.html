<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real-time Dashboard B2C - PERFORMANCE BAN-TAN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
    .table-responsive { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .sticky-col { position: sticky; left: 0; background: white !important; z-index: 5; border-right: 2px solid #dee2e6 !important; }
    .loading-screen { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .bg-pass { background-color: #d1e7dd !important; }
    .bg-fail { background-color: #f8d7da !important; }
    .table thead th { background: #007bff; color: white; white-space: nowrap; }
  </style>
</head>
<body>

  <div id="loading" class="loading-screen">
    <div class="spinner-border text-primary mb-3"></div>
    <p>Menarik data terbaru dari Spreadsheet...</p>
  </div>

  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">PERFORMANCE BAN-TAN - Live B2C</span>
      <button class="btn btn-sm btn-light" onclick="loadData()">Refresh Data</button>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="table-responsive">
      <table class="table table-sm table-bordered align-middle text-center">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtJptiwwrebpYAcrlKeeIlAYqAliLtFWxIeEkQ80cNPtkin3f-4_42Sr9JuuAz-fILJg/exec";

    async function loadData() {
      document.getElementById('loading').style.display = 'flex';
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        renderTable(data);
      } catch (error) {
        alert("Gagal memuat data. Pastikan Deployment URL benar dan akses diset ke 'Anyone'.");
        console.error(error);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderTable(rows) {
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');
      thead.innerHTML = "";
      tbody.innerHTML = "";

      rows.forEach((row, index) => {
        const tr = document.createElement('tr');
        
        row.forEach((cell, cellIndex) => {
          const el = (index === 0) ? 'th' : 'td';
          const cellEl = document.createElement(el);
          
          // Format Angka & Persentase
          let val = cell;
          if (typeof cell === 'number') val = cell.toFixed(2);
          cellEl.innerText = val;

          // Sticky Column untuk No & Indikator
          if (cellIndex < 2) cellEl.classList.add('sticky-col');
          if (cellIndex === 1) cellEl.style.textAlign = "left";

          // Cek Conditional Formatting (Jika kolom teknisi & bukan header)
          if (index > 0 && cellIndex >= 4) {
            const target = parseFloat(row[3]);
            const current = parseFloat(cell);
            if (!isNaN(target) && !isNaN(current)) {
              // Khusus Q Gangguan (Index 2 di data), angka kecil lebih baik
              if (index === 3) {
                cellEl.classList.add(current <= target ? 'bg-pass' : 'bg-fail');
              } else {
                cellEl.classList.add(current >= target ? 'bg-pass' : 'bg-fail');
              }
            }
          }
          tr.appendChild(cellEl);
        });

        if (index === 0) thead.appendChild(tr);
        else tbody.appendChild(tr);
      });
    }

    // Load data otomatis saat halaman dibuka
    loadData();
  </script>
</body>
</html>
