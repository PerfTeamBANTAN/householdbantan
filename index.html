<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERFORMANCE BAN-TAN - Dashboard Team</title>
  
  <!-- CSS Library -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-blue: #007bff;
      --secondary-gradient: linear-gradient(135deg, #0061ff 0%, #6033ff 100%);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }

    /* === NAVBAR === */
    .navbar-brand {
      font-weight: bold;
      font-size: 24px;
      color: #444;
    }

    .nav-link {
      color: #333 !important;
      transition: all 0.3s ease;
      padding: 8px 15px;
      border-radius: 6px;
    }

    .nav-link:hover {
      background-color: #f0f0f0;
      color: var(--primary-blue) !important;
    }

    .dropdown-menu {
      border: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    .dropdown-item:hover {
      background-color: var(--primary-blue);
      color: white;
    }

    /* === CONTENT AREA === */
    .home-fullscreen {
      width: 100%;
      min-height: calc(100vh - 70px);
      background: url('homescreen.png') center center / contain no-repeat;
      background-color: #ffffff;
      transition: background 0.5s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    /* === LEADERBOARD CARDS === */
    .leaderboard-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .rank-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      flex: 1;
      max-width: 250px;
      border-top: 5px solid #eee;
    }

    .rank-1 { border-color: #ffd700; }
    .rank-2 { border-color: #c0c0c0; }
    .rank-3 { border-color: #cd7f32; }

    /* === DASHBOARD TABLE === */
    .dashboard-card {
      width: 95%;
      max-width: 1400px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      margin-bottom: 50px;
    }

    .table-responsive {
      border-radius: 12px;
      overflow: hidden;
    }

    .table thead th {
      background-color: var(--primary-blue);
      color: white;
      font-size: 11px;
      text-transform: uppercase;
      white-space: nowrap;
      vertical-align: middle;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      background-color: white !important;
      z-index: 10;
      font-weight: 600;
      border-right: 2px solid #dee2e6 !important;
    }

    /* Conditional Colors */
    .bg-pass { background-color: #e3fcef !important; color: #008a52 !important; }
    .bg-fail { background-color: #fff5f5 !important; color: #e53e3e !important; }

    /* === LOADING OVERLAY === */
    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.9);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .home-fullscreen { background-size: cover; }
      .leaderboard-container { flex-direction: column; align-items: center; }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:void(0)" onclick="location.reload()">
        <img src="PERFORMANCE TEAM.png" style="height: 40px; margin-right: 10px;">
        PERFORMANCE BAN-TAN
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">

          <!-- RANGKING -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Rangking</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">Rangking Household</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="loadB2CData()">Rangking B2C</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">Rangking B2B</a></li>
            </ul>
          </li>

          <!-- KPI 12 PI LATEN -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">KPI 12 PI Laten</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">Dashboard 12 PI Laten</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">TimeLine Tower</a></li>
            </ul>
          </li>

          <!-- KPI B2C -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">KPI B2C</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="loadB2CData()">Dashboard B2C</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">Improvement B2C</a></li>
            </ul>
          </li>

          <!-- KPI LAINNYA -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Lainnya</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">KPI Maintenance</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)" onclick="showNotAvailable()">KPI WSA</a></li>
            </ul>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <!-- AREA KONTEN UTAMA -->
  <div class="home-fullscreen" id="homeFullscreen">
    <!-- Konten berganti secara dinamis antara Homescreen atau Dashboard -->
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <h5 class="fw-light">Menghubungkan ke Spreadsheet...</h5>
  </div>

  <script>
    // URL Web App Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtJptiwwrebpYAcrlKeeIlAYqAliLtFWxIeEkQ80cNPtkin3f-4_42Sr9JuuAz-fILJg/exec";

    function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

    // 1. FUNGSI LOAD DATA B2C SECARA DINAMIS
    async function loadB2CData() {
      showLoading();
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        const container = document.getElementById('homeFullscreen');
        container.style.background = "none";
        container.style.backgroundColor = "#f0f2f5";

        // Proses Leaderboard Top 3
        const names = data[0].slice(4);
        const achs = data[29].slice(4); // Baris 34 di Sheet
        const ranks = data[30].slice(4); // Baris 35 di Sheet
        
        let performers = names.map((n, i) => ({
          name: n, ach: achs[i], rank: parseInt(ranks[i])
        })).filter(x => !isNaN(x.rank)).sort((a,b) => a.rank - b.rank);

        // Render HTML
        let leaderboardHtml = `<div class="leaderboard-container">`;
        performers.slice(0, 3).forEach((p, idx) => {
          leaderboardHtml += `
            <div class="rank-card rank-${idx+1}">
              <div class="small text-muted fw-bold">RANK ${p.rank}</div>
              <h5 class="fw-bold my-2">${p.name}</h5>
              <div class="h4 fw-bold text-primary">${parseFloat(p.ach).toFixed(2)}%</div>
            </div>`;
        });
        leaderboardHtml += `</div>`;

        let tableHtml = `
          <div class="dashboard-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="fw-bold mb-0 text-primary"><i class="fas fa-table me-2"></i> DATA PENCAPAIAN KPI B2C</h5>
              <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="loadB2CData()"><i class="fas fa-sync"></i> Refresh</button>
            </div>
            <div class="table-responsive">
              <table class="table table-sm table-bordered table-hover align-middle text-center" style="font-size: 11.5px;">
                <thead>
                  <tr>${data[0].map((h, i) => `<th class="${i < 2 ? 'sticky-col' : ''}">${h}</th>`).join('')}</tr>
                </thead>
                <tbody>
                  ${data.slice(1).map((row, rIdx) => `
                    <tr>
                      ${row.map((cell, cIdx) => {
                        let className = cIdx < 2 ? 'sticky-col' : '';
                        let val = typeof cell === 'number' && cIdx > 2 ? cell.toFixed(2) : cell;
                        
                        // Logic Warna (Berdasarkan Target di Kolom D / Index 3)
                        if (rIdx < 27 && cIdx >= 4) {
                          const target = parseFloat(row[3]);
                          const current = parseFloat(cell);
                          if (!isNaN(target) && !isNaN(current)) {
                            // Khusus Q Gangguan (Baris index 2), angka kecil lebih baik
                            const isGood = (rIdx === 2) ? current <= target : current >= target;
                            className += isGood ? ' bg-pass' : ' bg-fail';
                          }
                        }
                        return `<td class="${className}">${val}</td>`;
                      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

        container.innerHTML = leaderboardHtml + tableHtml;

      } catch (error) {
        alert("Gagal menarik data dari Google Spreadsheet.");
        console.error(error);
      } finally {
        hideLoading();
      }
    }

    // 2. FUNGSI UNTUK MENU BELUM TERSEDIA
    function showNotAvailable() {
      showLoading();
      setTimeout(() => {
        hideLoading();
        const container = document.getElementById('homeFullscreen');
        container.style.background = "none";
        container.style.backgroundColor = "#fff";
        container.innerHTML = `
          <div class="text-center mt-5">
            <img src="under contruction.png" alt="Under Construction" style="width: 300px;">
            <h4 class="text-danger fw-bold mt-4">⚠️ Fitur Sedang Dikembangkan</h4>
            <p class="text-muted">Halaman ini belum tersedia. Silakan cek menu Rangking B2C.</p>
            <button class="btn btn-primary rounded-pill mt-3 px-4" onclick="location.reload()">Kembali ke Home</button>
          </div>
        `;
      }, 600);
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
