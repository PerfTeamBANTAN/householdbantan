<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERFORMANCE BAN-TAN - Dashboard Integrated</title>

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-blue: #004085;
      --accent-blue: #007bff;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* hilangkan scroll */
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 24px;
      color: #444;
    }

    .nav-link {
      color: #333 !important;
      transition: 0.3s;
      padding: 8px 15px;
      border-radius: 6px;
    }

    .nav-link:hover {
      background-color: #f0f0f0;
      color: var(--accent-blue) !important;
    }

    /* Nested dropdown fix (kalau nanti dipakai lagi) */
    .dropdown-submenu {
      position: relative;
    }

    .dropdown-menu .dropdown-menu {
      margin-left: 10px;
      top: 0;
    }

    @media (min-width: 992px) {
      .dropdown-menu .dropdown-menu {
        margin-left: 10px;
      }
    }

    /* Homescreen: mulai di bawah navbar dan pas 1 layar */
    .home-fullscreen {
      margin-top: 70px;                 /* kira-kira tinggi navbar */
      width: 100%;
      height: calc(100vh - 70px);       /* tinggi viewport - tinggi navbar */
      background: url('homescreen.png') center center / cover no-repeat;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="javascript:void(0)" onclick="location.reload()">
      <img src="PERFORMANCE TEAM.png" style="height: 40px; margin-right: 10px;" alt="Logo">
      PERFORMANCE BAN-TAN
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <!-- Menu Rangking -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            Rangking
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="javascript:void(0)">Rangking B2C</a></li>
            <li><a class="dropdown-item" href="javascript:void(0)">Rangking B2B</a></li>
          </ul>
        </li>

        <!-- Menu KPI -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            KPI
          </a>
          <ul class="dropdown-menu">
            <!-- Dashboard B2C nested (struktur tetap, belum ada JS) -->
            <li class="dropdown dropend">
              <a class="dropdown-item dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                Dashboard B2C
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="javascript:void(0)">IOAN BANTEN</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)">IOAN TANGERANG</a></li>
              </ul>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item" href="javascript:void(0)">Dashboard B2B</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Homescreen tepat di bawah navbar, full layar, tanpa scroll -->
<div class="home-fullscreen">
  <!-- Optional: text welcome -->
  <!--
  <div class="text-center text-white text-shadow">
    <h1 class="h3 fw-bold mb-2">PERFORMANCE BAN-TAN</h1>
    <p class="mb-0">Silakan pilih menu di navbar untuk melihat dashboard.</p>
  </div>
  -->
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
